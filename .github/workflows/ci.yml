# File: .github/workflows/ci.yml
# Purpose: Offline Phase 0 CI. Never connects to the fork node.
# Related: scripts/check_phase0.py
# Tags: #ci #phase0 #secrets
#
# Why: operator said there is no regtest fixture. Live RPC stays out of CI.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Phase 0 matrix, fixtures, secret scan
        run: uv run python scripts/check_phase0.py
